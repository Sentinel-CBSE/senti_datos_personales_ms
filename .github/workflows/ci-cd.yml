name: CI/CD - senti_datos_personales_ms

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    environment: senti_datos_personales_ms_dockerhub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sentinel:${{ github.sha }} \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/sentinel:latest \
            .

      - name: Push Docker image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinel:${{ github.sha }}

          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/sentinel:latest

      - name: Trigger infrastructure pipeline
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/Sentinel-CBSE/senti_infra/dispatches \
            -f event_type='deploy' \
            -f client_payload[service]='senti_datos_personales_ms' \
            -f client_payload[tag]='${{ github.sha }}'
        env:
          GH_TOKEN: ${{ secrets.INFRA_REPO_TOKEN }}
